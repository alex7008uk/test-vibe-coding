<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師個人簡介 - 經歷與課程</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 導航列 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">教師簡介</div>
            <ul class="nav-links">
                <li><a href="#hero">首頁</a></li>
                <li><a href="#about">經歷</a></li>
                <li><a href="#courses">課程</a></li>
            </ul>
        </div>
    </nav>

    <!-- 英雄區塊 -->
    <section id="hero" class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">歡迎來到我的教學世界</h1>
                <p class="hero-subtitle">專業教學 · 用心指導 · 成就未來</p>
                <a href="#courses" class="cta-button">探索課程</a>
            </div>
        </div>
    </section>

    <!-- 經歷介紹區塊 -->
    <section id="about" class="about">
        <div class="container">
            <h2 class="section-title">教師經歷</h2>
            <div class="about-content" id="aboutContent">
                <!-- 使用 JavaScript 動態生成 -->
            </div>
        </div>
    </section>

    <!-- 課程介紹區塊 -->
    <section id="courses" class="courses">
        <div class="container">
            <h2 class="section-title">課程介紹</h2>
            <div class="courses-grid" id="coursesGrid">
                <!-- 使用 JavaScript 動態生成卡片 -->
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 教師個人網站. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
